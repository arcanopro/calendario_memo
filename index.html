<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agenda Logística - Vista Calendario</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus Jakarta Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>

    <style>
        :root {
            --bg-principal: #0f172a;
            --bg-tarjeta: #1e293b;
            --borde: #334155;
            --texto-primario: #f8fafc;
            --texto-secundario: #94a3b8;
            --acento: #06b6d4;
            --acento-hover: #0891b2;
            --grabando: #ef4444;
            --exito: #10b981;
            --casillero-bg: #0f172a;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; -webkit-tap-highlight-color: transparent; }
        body { background-color: var(--bg-principal); color: var(--texto-primario); display: flex; justify-content: center; min-height: 100vh; padding: 20px; }
        .contenedor-app { width: 100%; max-width: 500px; background-color: var(--bg-tarjeta); border: 1px solid var(--borde); border-radius: 24px; padding: 24px; }

        /* ENCABEZADO */
        .encabezado { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .titulo h1 { font-size: 20px; font-weight: 700; }
        .titulo p { font-size: 13px; color: var(--texto-secundario); }
        .estado-conexion { font-size: 12px; padding: 4px 10px; border-radius: 20px; background: rgba(6,182,212,0.1); color: var(--acento); border: 1px solid rgba(6,182,212,0.2); }

        /* TABS */
        .tabs-navegacion { display: flex; gap: 10px; margin-bottom: 20px; background: rgba(15,23,42,0.6); padding: 5px; border-radius: 12px; border: 1px solid var(--borde); }
        .tab-btn { flex: 1; padding: 10px; background: transparent; border: none; color: var(--texto-secundario); border-radius: 8px; font-weight: 600; cursor: pointer; transition: all 0.2s; }
        .tab-btn.activo { background: var(--acento); color: white; }

        /* VISTAS */
        .vista { display: none; }
        .vista.activa { display: block; }

        /* VISTA RÁPIDA */
        .seccion-captura { display: flex; flex-direction: column; align-items: center; gap: 15px; margin-bottom: 20px; }
        .btn-mic { width: 70px; height: 70px; border-radius: 50%; border: none; background-color: var(--acento); color: white; font-size: 28px; cursor: pointer; transition: 0.3s; }
        .btn-mic.grabando { background-color: var(--grabando); box-shadow: 0 0 0 10px rgba(239,68,68,0.3); }
        .indicador-estado { font-size: 13px; color: var(--texto-secundario); text-align: center; }
        .entrada-texto { width: 100%; min-height: 80px; background: rgba(15,23,42,0.6); border: 1px solid var(--borde); border-radius: 12px; padding: 12px; color: white; margin-bottom: 15px; resize: vertical; }
        .entrada-fecha { width: 100%; background: rgba(15,23,42,0.6); border: 1px solid var(--borde); border-radius: 12px; padding: 12px; color: white; margin-bottom: 15px; }
        .btn-accion { width: 100%; background: var(--acento); color: white; border: none; border-radius: 12px; padding: 14px; font-weight: 600; cursor: pointer; display: flex; justify-content: center; gap: 8px; font-size: 14px; }
        .btn-accion:hover { background: var(--acento-hover); }

        /* CALENDARIO HEADER */
        .calendario-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; }
        .btn-mes { background: rgba(255,255,255,0.08); border: 1px solid var(--borde); color: white; padding: 7px 13px; border-radius: 8px; cursor: pointer; transition: 0.2s; }
        .btn-mes:hover { background: rgba(6,182,212,0.2); border-color: var(--acento); }
        .mes-actual { font-weight: 700; font-size: 16px; text-transform: capitalize; }

        /* DÍAS SEMANA */
        .dias-semana { display: grid; grid-template-columns: repeat(7, 1fr); text-align: center; font-size: 11px; font-weight: 700; color: var(--texto-secundario); margin-bottom: 5px; }
        .dias-semana div { padding: 3px 0; }

        /* GRID CALENDARIO */
        .calendario-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 3px; }

        /* CASILLERO NORMAL */
        .casillero {
            aspect-ratio: 1/1;
            min-width: 0;
            background: var(--casillero-bg);
            border: 1px solid var(--borde);
            border-radius: 7px;
            display: flex;
            flex-direction: column;
            padding: 4px 3px 3px;
            cursor: pointer;
            transition: border-color 0.15s, background 0.15s;
            overflow: hidden;
            position: relative;
        }
        .casillero:hover { border-color: var(--acento); background: #162032; }
        .casillero.vacio { background: transparent; border-color: transparent; cursor: default; pointer-events: none; }
        .casillero.hoy { border-color: var(--acento); background: rgba(6,182,212,0.07); }
        .nro-dia { font-size: 11px; font-weight: 600; color: var(--texto-secundario); line-height: 1; }
        .casillero.hoy .nro-dia { color: var(--acento); }
        .indicador-notas { flex: 1; display: flex; flex-direction: column; justify-content: flex-end; align-items: center; gap: 1px; }
        .punto-nota { width: 5px; height: 5px; background: var(--acento); border-radius: 50%; }
        .texto-prev { font-size: 7px; color: rgba(255,255,255,0.6); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; width: 100%; text-align: center; }

        /* =============================================
           PANEL EXPANDIDO — ocupa 2 filas × 7 columnas
           ============================================= */
        .panel-expandido {
            grid-column: 1 / -1;
            background: #162032;
            border: 1px solid var(--acento);
            border-radius: 12px;
            padding: 14px;
            animation: slideDown 0.22s ease;
        }
        @keyframes slideDown { from { opacity:0; transform: translateY(-6px); } to { opacity:1; transform: translateY(0); } }

        .panel-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }
        .panel-fecha-titulo { font-size: 13px; font-weight: 700; color: var(--acento); }
        .btn-panel-cerrar {
            background: rgba(255,255,255,0.06);
            border: 1px solid var(--borde);
            color: var(--texto-secundario);
            width: 26px; height: 26px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            display: flex; align-items: center; justify-content: center;
            transition: 0.15s;
        }
        .btn-panel-cerrar:hover { background: rgba(239,68,68,0.15); border-color: var(--grabando); color: #fca5a5; }

        /* Lista notas dentro del panel */
        .panel-lista { display: flex; flex-direction: column; gap: 8px; margin-bottom: 12px; }
        .panel-sin-notas { font-size: 12px; color: var(--texto-secundario); text-align: center; padding: 10px 0; font-style: italic; }

        .panel-nota {
            background: rgba(15,23,42,0.7);
            border-left: 3px solid var(--acento);
            border-radius: 8px;
            padding: 10px 10px 8px;
        }
        .panel-nota.modo-edicion { border-left-color: #f59e0b; background: rgba(245,158,11,0.04); }
        .panel-nota-texto { font-size: 12px; color: var(--texto-primario); line-height: 1.5; word-break: break-word; }
        .panel-nota-textarea {
            width: 100%;
            background: rgba(0,0,0,0.35);
            border: 1px solid #f59e0b;
            border-radius: 6px;
            color: white;
            font-size: 12px;
            padding: 7px 9px;
            resize: vertical;
            min-height: 48px;
            font-family: inherit;
            line-height: 1.5;
            outline: none;
        }
        .panel-nota-acciones { display: flex; gap: 6px; margin-top: 8px; justify-content: flex-end; flex-wrap: wrap; }

        /* BOTONES DE ACCIÓN — bien visibles */
        .pbtn {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            padding: 5px 11px;
            border-radius: 6px;
            font-size: 11px;
            font-weight: 700;
            cursor: pointer;
            border: none;
            font-family: inherit;
            transition: opacity 0.15s, transform 0.1s;
        }
        .pbtn:active { transform: scale(0.96); }
        .pbtn-editar  { background: #0e7490; color: #fff; }
        .pbtn-editar:hover  { background: #0891b2; }
        .pbtn-guardar { background: #059669; color: #fff; }
        .pbtn-guardar:hover { background: #10b981; }
        .pbtn-cancelar{ background: #334155; color: #cbd5e1; }
        .pbtn-cancelar:hover{ background: #475569; color: #fff; }
        .pbtn-borrar  { background: #b91c1c; color: #fff; }
        .pbtn-borrar:hover  { background: #ef4444; }

        /* AGREGAR NUEVA NOTA */
        .panel-agregar { border-top: 1px dashed var(--borde); padding-top: 12px; display: flex; gap: 8px; align-items: flex-end; }
        .panel-agregar textarea {
            flex: 1;
            min-height: 40px;
            background: rgba(0,0,0,0.25);
            border: 1px solid var(--borde);
            border-radius: 8px;
            padding: 8px 10px;
            color: white;
            font-size: 12px;
            font-family: inherit;
            resize: vertical;
            transition: border-color 0.2s;
            outline: none;
        }
        .panel-agregar textarea:focus { border-color: var(--acento); }
        .btn-agregar-nota {
            flex-shrink: 0;
            background: var(--acento);
            border: none;
            color: white;
            border-radius: 8px;
            padding: 9px 14px;
            font-size: 12px;
            font-weight: 700;
            cursor: pointer;
            display: flex; align-items: center; gap: 5px;
            font-family: inherit;
            transition: background 0.2s;
        }
        .btn-agregar-nota:hover { background: var(--acento-hover); }
    </style>
</head>
<body>
<div class="contenedor-app">
    <div class="encabezado">
        <div class="titulo">
            <h1>Agenda Operativa</h1>
            <p>Gestión de Memos</p>
        </div>
        <div class="estado-conexion" id="estadoDB">Conectado</div>
    </div>

    <div class="tabs-navegacion">
        <button class="tab-btn activo" onclick="cambiarVista('rapida')">Acción Rápida</button>
        <button class="tab-btn" onclick="cambiarVista('calendario')">Calendario</button>
    </div>

    <!-- VISTA: ACCIÓN RÁPIDA -->
    <div id="vistaRapida" class="vista activa">
        <div class="seccion-captura">
            <button class="btn-mic" id="btnGrabarRapido" title="Toca para grabar">
                <i class="fa-solid fa-microphone"></i>
            </button>
            <div class="indicador-estado" id="estadoTextoRapido">Toca para dictar nueva nota</div>
        </div>
        <textarea id="memoTexto" class="entrada-texto" placeholder="Escribe o dicta tu memo aquí..."></textarea>
        <input type="date" id="memoFecha" class="entrada-fecha">
        <button class="btn-accion" onclick="guardarMemoNuevo()">
            <i class="fa-solid fa-floppy-disk"></i> Guardar en Agenda
        </button>
    </div>

    <!-- VISTA: CALENDARIO -->
    <div id="vistaCalendario" class="vista">
        <div class="calendario-header">
            <button class="btn-mes" onclick="cambiarMes(-1)"><i class="fa-solid fa-chevron-left"></i></button>
            <div class="mes-actual" id="mesActualEtiqueta"></div>
            <button class="btn-mes" onclick="cambiarMes(1)"><i class="fa-solid fa-chevron-right"></i></button>
        </div>
        <div class="dias-semana">
            <div>Dom</div><div>Lun</div><div>Mar</div><div>Mié</div><div>Jue</div><div>Vie</div><div>Sáb</div>
        </div>
        <div class="calendario-grid" id="gridCalendario"></div>
    </div>
</div>

<script>
    // ─── FIREBASE ───────────────────────────────────────────
    const firebaseConfig = {
        apiKey: "AIzaSyDvwtfaHtxyg481K9W7gSZyiYicqopBUPc",
        authDomain: "viajeros-9ae0e.firebaseapp.com",
        databaseURL: "https://viajeros-9ae0e-default-rtdb.firebaseio.com",
        projectId: "viajeros-9ae0e",
        storageBucket: "viajeros-9ae0e.firebasestorage.app",
        messagingSenderId: "583517134130",
        appId: "1:583517134130:web:0b55aa3b14413f72da4b2b"
    };
    firebase.initializeApp(firebaseConfig);
    const database = firebase.database();

    // ─── ESTADO ─────────────────────────────────────────────
    let fechaNavegacion = new Date();
    let memosTotales = {};
    let fechaPanelActiva = null;

    document.getElementById('memoFecha').valueAsDate = new Date();
    cargarDatosFirebase();

    // ─── TABS ────────────────────────────────────────────────
    function cambiarVista(vista) {
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('activo'));
        document.querySelectorAll('.vista').forEach(v => v.classList.remove('activa'));
        if (vista === 'rapida') {
            document.querySelectorAll('.tab-btn')[0].classList.add('activo');
            document.getElementById('vistaRapida').classList.add('activa');
        } else {
            document.querySelectorAll('.tab-btn')[1].classList.add('activo');
            document.getElementById('vistaCalendario').classList.add('activa');
            renderizarCalendario();
        }
    }

    function cambiarMes(delta) {
        fechaNavegacion.setMonth(fechaNavegacion.getMonth() + delta);
        fechaPanelActiva = null;
        renderizarCalendario();
    }

    // ─── RENDERIZAR CALENDARIO ───────────────────────────────
    function renderizarCalendario() {
        const grid = document.getElementById('gridCalendario');
        grid.innerHTML = '';

        const mes  = fechaNavegacion.getMonth();
        const anio = fechaNavegacion.getFullYear();
        const nombres = ["Enero","Febrero","Marzo","Abril","Mayo","Junio","Julio","Agosto","Septiembre","Octubre","Noviembre","Diciembre"];
        document.getElementById('mesActualEtiqueta').innerText = `${nombres[mes]} ${anio}`;

        const primerDia   = new Date(anio, mes, 1).getDay();
        const diasEnMes   = new Date(anio, mes + 1, 0).getDate();
        const hoy         = new Date();
        const mesStr      = String(mes + 1).padStart(2, '0');

        // Celdas vacías
        for (let i = 0; i < primerDia; i++) {
            const v = document.createElement('div');
            v.className = 'casillero vacio';
            grid.appendChild(v);
        }

        // Días del mes
        for (let dia = 1; dia <= diasEnMes; dia++) {
            const diaStr    = String(dia).padStart(2, '0');
            const fechaStr  = `${anio}-${mesStr}-${diaStr}`;
            const esHoy     = dia === hoy.getDate() && mes === hoy.getMonth() && anio === hoy.getFullYear();
            const notas     = memosTotales[fechaStr] || [];

            const celda = document.createElement('div');
            celda.className = 'casillero' + (esHoy ? ' hoy' : '');
            celda.dataset.fecha = fechaStr;

            let inner = `<span class="nro-dia">${dia}</span><div class="indicador-notas">`;
            if (notas.length > 0) {
                inner += `<div class="punto-nota"></div>`;
                inner += `<span class="texto-prev">${notas[0].texto}</span>`;
            }
            inner += `</div>`;
            celda.innerHTML = inner;

            celda.addEventListener('click', () => togglePanel(fechaStr, celda));
            grid.appendChild(celda);

            // Si este día estaba abierto, reinyectar el panel después de la celda
            if (fechaPanelActiva === fechaStr) {
                grid.appendChild(crearPanelExpandido(fechaStr));
            }
        }
    }

    // ─── PANEL EXPANDIDO ─────────────────────────────────────
    function togglePanel(fechaStr, celdaEl) {
        // Si ya está abierto este panel → cerrar
        if (fechaPanelActiva === fechaStr) {
            fechaPanelActiva = null;
            renderizarCalendario();
            return;
        }
        fechaPanelActiva = fechaStr;
        renderizarCalendario();

        // Hacer scroll suave al panel
        setTimeout(() => {
            const panel = document.querySelector('.panel-expandido');
            if (panel) panel.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
        }, 50);
    }

    function crearPanelExpandido(fechaStr) {
        const partes = fechaStr.split('-');
        const titulo = `${partes[2]}/${partes[1]}/${partes[0]}`;
        const notas  = memosTotales[fechaStr] || [];

        const panel = document.createElement('div');
        panel.className = 'panel-expandido';
        panel.id = 'panelExpandido';

        // Header
        panel.innerHTML = `
            <div class="panel-header">
                <span class="panel-fecha-titulo"><i class="fa-solid fa-calendar-day" style="margin-right:6px"></i>${titulo}</span>
                <button class="btn-panel-cerrar" onclick="cerrarPanel()" title="Cerrar"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <div class="panel-lista" id="panelLista"></div>
            <div class="panel-agregar">
                <textarea id="textoNuevaNota" placeholder="Nueva nota para este día..."></textarea>
                <button class="btn-agregar-nota" onclick="agregarNota()">
                    <i class="fa-solid fa-plus"></i> Agregar
                </button>
            </div>
        `;

        // Llenar lista
        const lista = panel.querySelector('#panelLista');
        if (notas.length === 0) {
            lista.innerHTML = `<p class="panel-sin-notas">Sin notas aún — agregá una abajo ↓</p>`;
        } else {
            notas.forEach(nota => {
                lista.appendChild(crearItemNota(nota));
            });
        }

        return panel;
    }

    function crearItemNota(nota) {
        const div = document.createElement('div');
        div.className = 'panel-nota';
        div.id = `pnota_${nota.id}`;
        div.innerHTML = `
            <div class="panel-nota-texto">${nota.texto}</div>
            <div class="panel-nota-acciones">
                <button class="pbtn pbtn-editar" onclick="editarNota('${nota.id}', \`${nota.texto.replace(/`/g,'\\`').replace(/\n/g,'\\n')}\`)">
                    <i class="fa-solid fa-pen"></i> Editar
                </button>
                <button class="pbtn pbtn-borrar" onclick="borrarNota('${nota.id}')">
                    <i class="fa-solid fa-trash"></i> Borrar
                </button>
            </div>
        `;
        return div;
    }

    function cerrarPanel() {
        fechaPanelActiva = null;
        renderizarCalendario();
    }

    // ─── EDITAR ──────────────────────────────────────────────
    function editarNota(id, textoActual) {
        const div = document.getElementById(`pnota_${id}`);
        if (!div) return;
        div.classList.add('modo-edicion');
        div.innerHTML = `
            <textarea class="panel-nota-textarea" id="editta_${id}">${textoActual}</textarea>
            <div class="panel-nota-acciones">
                <button class="pbtn pbtn-guardar" onclick="guardarEdicion('${id}')">
                    <i class="fa-solid fa-check"></i> Guardar
                </button>
                <button class="pbtn pbtn-cancelar" onclick="cancelarEdicion()">
                    <i class="fa-solid fa-xmark"></i> Cancelar
                </button>
                <button class="pbtn pbtn-borrar" onclick="borrarNota('${id}')">
                    <i class="fa-solid fa-trash"></i> Borrar
                </button>
            </div>
        `;
        const ta = document.getElementById(`editta_${id}`);
        if (ta) { ta.focus(); ta.setSelectionRange(ta.value.length, ta.value.length); }
    }

    function cancelarEdicion() {
        // Re-renderizar el panel sin cambios
        const panel = document.getElementById('panelExpandido');
        if (!panel || !fechaPanelActiva) return;
        const lista = document.getElementById('panelLista');
        lista.innerHTML = '';
        const notas = memosTotales[fechaPanelActiva] || [];
        if (notas.length === 0) {
            lista.innerHTML = `<p class="panel-sin-notas">Sin notas aún — agregá una abajo ↓</p>`;
        } else {
            notas.forEach(nota => lista.appendChild(crearItemNota(nota)));
        }
    }

    function guardarEdicion(id) {
        const ta = document.getElementById(`editta_${id}`);
        const nuevoTexto = ta ? ta.value.trim() : '';
        if (!nuevoTexto) return alert("El texto no puede estar vacío.");
        database.ref('memos/' + id).update({ texto: nuevoTexto });
        // La actualización en tiempo real de Firebase disparará cargarDatosFirebase → re-render
    }

    // ─── AGREGAR ─────────────────────────────────────────────
    function agregarNota() {
        const ta = document.getElementById('textoNuevaNota');
        const texto = ta ? ta.value.trim() : '';
        if (!texto) return;
        database.ref('memos').push().set({
            texto: texto,
            fecha_agendada: fechaPanelActiva,
            creado_en: firebase.database.ServerValue.TIMESTAMP
        }).then(() => { if (ta) ta.value = ''; });
    }

    // ─── BORRAR ──────────────────────────────────────────────
    function borrarNota(id) {
        if (confirm("¿Eliminar esta nota?")) {
            database.ref('memos/' + id).remove();
        }
    }

    // ─── FIREBASE LOAD ───────────────────────────────────────
    function cargarDatosFirebase() {
        database.ref('memos').on('value', (snapshot) => {
            memosTotales = {};
            snapshot.forEach((hijo) => {
                const memo = hijo.val();
                const id   = hijo.key;
                if (memo.fecha_agendada) {
                    if (!memosTotales[memo.fecha_agendada]) memosTotales[memo.fecha_agendada] = [];
                    memosTotales[memo.fecha_agendada].push({ id, texto: memo.texto });
                }
            });
            if (document.getElementById('vistaCalendario').classList.contains('activa')) {
                renderizarCalendario();
            }
        });
    }

    // ─── GUARDAR MEMO RÁPIDO ─────────────────────────────────
    function guardarMemoNuevo() {
        const texto = document.getElementById('memoTexto').value.trim();
        const fecha = document.getElementById('memoFecha').value;
        if (!texto) return alert("Escribe o dicta algo primero.");
        if (!fecha) return alert("Seleccioná una fecha.");
        database.ref('memos').push().set({
            texto,
            fecha_agendada: fecha,
            creado_en: firebase.database.ServerValue.TIMESTAMP
        }).then(() => {
            document.getElementById('memoTexto').value = "";
            const el = document.getElementById('estadoTextoRapido');
            el.innerText = "✅ Nota guardada";
            el.style.color = "var(--exito)";
            setTimeout(() => {
                el.innerText = "Toca para dictar nueva nota";
                el.style.color = "var(--texto-secundario)";
            }, 3000);
        });
    }

    // ─── VOZ ─────────────────────────────────────────────────
    let targetTextareaId = null;
    let targetBtn = null;
    const SpeechRec = window.SpeechRecognition || window.webkitSpeechRecognition;
    const reconocimiento = SpeechRec ? new SpeechRec() : null;

    if (reconocimiento) {
        reconocimiento.lang = 'es-AR';
        reconocimiento.continuous = false;
        reconocimiento.onstart = () => targetBtn && targetBtn.classList.add('grabando');
        reconocimiento.onend   = () => targetBtn && targetBtn.classList.remove('grabando');
        reconocimiento.onresult = (e) => {
            const trans = e.results[0][0].transcript;
            const ta = document.getElementById(targetTextareaId);
            if (ta) ta.value = ta.value.trim() ? ta.value + ' ' + trans : trans;
        };
        document.getElementById('btnGrabarRapido').onclick = function() {
            targetTextareaId = 'memoTexto';
            targetBtn = this;
            reconocimiento.start();
        };
    } else {
        document.getElementById('btnGrabarRapido').style.opacity = '0.5';
    }
</script>
</body>
</html>
