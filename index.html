<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Parroquia Sagrada Familia</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Inter',sans-serif;
}

body{
    min-height:100vh;
    background: linear-gradient(135deg,#0f2027,#203a43,#2c5364);
    display:flex;
    justify-content:center;
    align-items:center;
    color:#fff;
}

/* CONTENEDOR PRINCIPAL */
.container{
    width:90%;
    max-width:420px;
    padding:25px;
    border-radius:25px;
    backdrop-filter: blur(15px);
    background: rgba(255,255,255,0.05);
    box-shadow: 0 20px 40px rgba(0,0,0,0.4);
    text-align:center;
}

/* IMAGEN */
.header img{
    width:100%;
    max-width:260px;
    border-radius:20px;
    margin-bottom:15px;
    box-shadow:0 10px 30px rgba(0,0,0,0.5);
}

/* TITULO */
h1{
    font-size:22px;
    font-weight:600;
    margin-bottom:25px;
    letter-spacing:1px;
}

/* BOTONES */
.btn{
    display:flex;
    align-items:center;
    justify-content:center;
    text-decoration:none;
    color:white;
    margin:12px 0;
    padding:14px;
    border-radius:14px;
    font-size:15px;
    font-weight:500;
    position:relative;
    overflow:hidden;
    transition: all 0.3s ease;
    background: rgba(255,255,255,0.08);
    border: 1px solid rgba(255,255,255,0.15);
}

/* EFECTO LUZ */
.btn::before{
    content:'';
    position:absolute;
    top:0;
    left:-100%;
    width:100%;
    height:100%;
    background: linear-gradient(120deg,transparent,rgba(255,255,255,0.3),transparent);
    transition:0.5s;
}

.btn:hover::before{
    left:100%;
}

.btn:hover{
    transform: translateY(-3px) scale(1.01);
    background: rgba(255,255,255,0.15);
}

/* COLORES SUTILES */
.web { border-left:4px solid #00c6ff; }
.capilla { border-left:4px solid #8e2de2; }
.horarios { border-left:4px solid #00ffb0; }
.evangelio { border-left:4px solid #f9d423; }
.facebook { border-left:4px solid #1877f2; }
.instagram { border-left:4px solid #ff4e8a; }

/* FOOTER */
footer{
    margin-top:18px;
    font-size:11px;
    opacity:0.7;
}

</style>
</head>

<body>

<div class="container">

    <div class="header">
        <img src="fotopsf.png">
        <h1>Parroquia Sagrada Familia</h1>
    </div>

    <a class="btn web" href="https://sites.google.com/view/psagradafamilia/inicio">🌐 Web</a>

    <a class="btn capilla" href="https://sites.google.com/view/psagradafamilia/inicio/capilla-juan-pablo-ii">⛪ Capilla San Juan Pablo II</a>

    <a class="btn horarios" href="https://sites.google.com/view/psagradafamilia/inicio/informaci%C3%B3n">🕊️ Horarios de misa</a>

    <a class="btn evangelio" href="https://www.vaticannews.va/es/evangelio-de-hoy.html">📖 Evangelio del día</a>

    <a class="btn facebook" href="https://www.facebook.com/share/16rpmWnSBR/">📘 Facebook</a>

    <a class="btn instagram" href="https://www.instagram.com/sagradafamiliaparroquia70?igsh=eDdiYmhpN3N1enTz">📸 Instagram</a>

    <footer>
        Sagrada Familia · ¡Vivamos en comunidad el anuncio de la palabra!

    </footer>

</div>

</body>
</html>
